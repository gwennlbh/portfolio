name: Build & deploy

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { lang: en, locale: en-US }
          - { lang: fr, locale: fr-FR }
    name: ${{ matrix.locale }}
    environment:
      name: ${{ matrix.lang }}.gwen.works
      url: https://${{ matrix.lang }}.gwen.works
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        env:
          LANG: ${{ matrix.lang }}
          LOCALE: ${{ matrix.locale }}
          BUILD_COMMIT: ${{ github.sha }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - name: Deploy to Netlify
        run: bunx netlify deploy
          --prod
          --no-build
          --dir=dist
          --site=${{ matrix.lang }}.gwen.works
          --auth=${{ secrets.NETLIFY_TOKEN }}
          --message="${{ github.ref_name }}@${{ github.sha }}"

      - name: check if ${{ github.sha }} is deployed on ${{ matrix.lang }}.gwen.works
        run: |
          wget https://${{ matrix.lang }}.gwen.works/
          while ! grep "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" index.html; do
            grep -o 'https://github.com/${{ github.repository }}/commit/[a-zA-Z0-9]*' index.html
            sleep 5
            rm index.html
            wget https://${{ matrix.lang }}.gwen.works/
          done
